<%+header%>

<div class="cyber-panel">
	<h2><%:Change Root Password%></h2>
	<form method="post" action="<%=luci.dispatcher.build_url("admin", "system", "admin")%>">
		<div class="cyber-form-group">
			<label class="cyber-label"><%:New Password%></label>
			<input type="password" class="cyber-input" name="pw1" required minlength="5">
		</div>
		<div class="cyber-form-group">
			<label class="cyber-label"><%:Confirm Password%></label>
			<input type="password" class="cyber-input" name="pw2" required minlength="5">
		</div>
		<div class="cyber-actions">
			<button type="submit" class="cyber-btn"><%:SAVE PASSWORD%></button>
		</div>
	</form>
</div>

<%+footer%>
